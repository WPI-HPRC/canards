; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
boards_dir = board/boards
default_envs = marsv21

[env:marsv20]
platform = ststm32
framework = arduino
board = marsv20
board_build.variants_dir = board/variants
extra_scripts = scripts/dfu_touch.py
build_flags =
	-DSPI_DRIVER_SELECT=2      ; SdFat soft SPI: the SD slot's SDMMC pins have no hardware SPI mapping
	-DPIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF  ; %f in printf (debug prints)
	-DSERIAL_TX_BUFFER_SIZE=1024  ; a whole telemetry line (<= ~925 B) fits, so sending never blocks the loop
	-DSERIAL_RX_BUFFER_SIZE=1024  ; radio bytes wait here between loop() iterations
lib_deps = 
	greiman/SdFat@^2.2.3
	sparkfun/SparkFun u-blox GNSS v3@^3.1.8
	stm32duino/STM32duino ASM330LHH@^2.0.1
	stm32duino/STM32duino LIS2MDL@^2.0.1
	stm32duino/STM32duino LPS22HB@^2.0.0
	stm32duino/STM32duino LSM6DSO32@^1.0.0

[env:marsv20_debug]
extends = env:marsv20
build_flags =
	${env:marsv20.build_flags}
	-D DEBUG

[env:marsv21]
platform = ststm32@19.6.0
framework = arduino
board = marsv21
board_build.variants_dir = board/variants
extra_scripts = scripts/dfu_touch.py
build_flags =
	-DSPI_DRIVER_SELECT=2      ; SdFat soft SPI: the SD slot's SDMMC pins have no hardware SPI mapping
	-DPIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF  ; %f in printf (debug prints)
	-DSERIAL_TX_BUFFER_SIZE=1024  ; a whole telemetry line (<= ~925 B) fits, so sending never blocks the loop
	-DSERIAL_RX_BUFFER_SIZE=1024  ; radio bytes wait here between loop() iterations
lib_deps = 
	greiman/SdFat@^2.2.3
	sparkfun/SparkFun u-blox GNSS v3@^3.1.8
	stm32duino/STM32duino ASM330LHH@^2.0.1
	stm32duino/STM32duino LIS2MDL@^2.0.1
	stm32duino/STM32duino LPS22HB@^2.0.0
	stm32duino/STM32duino LSM6DSO32@^1.0.0

[env:marsv21_debug]
extends = env:marsv21
build_flags =
	${env:marsv21.build_flags}
	-D DEBUG
