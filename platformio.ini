; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Programs in this repo (see docs/HANDOFF-flight-skeleton-2026-11-20.md):
;   marsv21 / marsv21_debug                  the flight program (src/)
;   marsv21_bringup / marsv21_bringup_debug  the sensor/SD/GPS bring-up sketch (bringup/)
;   marsv20_bringup / marsv20_bringup_debug  the same sketch for the v2.0 board
;   native                                   desktop tests of the flight logic:
;                                              ~/.platformio/penv/bin/pio test -e native

[platformio]
boards_dir = board/boards
default_envs = marsv21

; Settings shared by every program that runs on a MARS board.
[mars]
framework = arduino
board_build.variants_dir = board/variants
extra_scripts = scripts/dfu_touch.py
build_flags =
	-DSPI_DRIVER_SELECT=2
	-DPIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF
lib_deps =
	greiman/SdFat@^2.2.3
	sparkfun/SparkFun u-blox GNSS v3@^3.1.8
	stm32duino/STM32duino ASM330LHH@^2.0.1
	stm32duino/STM32duino LIS2MDL@^2.0.1
	stm32duino/STM32duino LPS22HB@^2.0.0
	stm32duino/STM32duino LSM6DSO32@^1.0.0
	tomstewart89/BasicLinearAlgebra@^5.1

; The folders of src/ that hold flight logic. They must never include Arduino
; headers: the native env builds exactly these, so a stray #include <Arduino.h>
; fails the desktop tests. Add a folder here when you add one to src/.
[flight_logic]
build_src_filter =
	+<StateMachine/>
	+<Subsystems/>
	+<Estimator/>
	+<AttitudeControl/>
	+<ServoControl/>
	+<Safety/>
	+<FlightComputer.cpp>

; The bring-up sketch lives outside src/ and uses a few drivers from src/.
[bringup]
build_src_filter =
	-<*>
	+<../bringup/>
	+<dfu_bootloader.cpp>
	+<sdcard.cpp>
	+<max10s.cpp>
	+<simple_estimator.cpp>

; ---------------------------------------------------------------------------
; Flight program
; ---------------------------------------------------------------------------

[env:marsv21]
extends = mars
platform = ststm32@19.6.0
board = marsv21

[env:marsv21_debug]
extends = env:marsv21
build_flags =
	${mars.build_flags}
	-D DEBUG

; ---------------------------------------------------------------------------
; Bring-up sketch (bringup/main.cpp)
; ---------------------------------------------------------------------------

[env:marsv21_bringup]
extends = mars
platform = ststm32@19.6.0
board = marsv21
build_src_filter = ${bringup.build_src_filter}

[env:marsv21_bringup_debug]
extends = env:marsv21_bringup
build_flags =
	${mars.build_flags}
	-D DEBUG

[env:marsv20_bringup]
extends = mars
platform = ststm32@19.6.0
board = marsv20
build_src_filter = ${bringup.build_src_filter}

[env:marsv20_bringup_debug]
extends = env:marsv20_bringup
build_flags =
	${mars.build_flags}
	-D DEBUG

; ---------------------------------------------------------------------------
; Desktop tests: pio test -e native
; ---------------------------------------------------------------------------

[env:native]
platform = native
test_framework = unity
; test/support/ holds header-only fakes shared by the suites.
; Build the flight logic into every test suite, and nothing else from src/.
test_build_src = yes
build_src_filter =
	-<*>
	${flight_logic.build_src_filter}
build_flags =
	-std=c++17
	-Wall
	-Wextra
	-I src
	-I test/support
	-fsanitize=address,undefined
	-fno-omit-frame-pointer
